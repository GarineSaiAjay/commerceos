services:
  postgres:
    image: postgres:17
    container_name: commerceos-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: commerceos
      POSTGRES_USER: commerceos
      POSTGRES_PASSWORD: commerceos_dev_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: commerceos-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: commerceos-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgres://commerceos:commerceos_dev_password@postgres:5432/commerceos?sslmode=disable
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      API_GATEWAY_PORT: "8080"
      COMMERCE_PORT: "8081"
      AGENT_API_PORT: "8082"
      DASHBOARD_PORT: "8083"

    ports:
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"

    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data: